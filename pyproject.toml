[project]
name = "TILEs"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
    "shapely"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["TILEs"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "pyrefly",
    "pytest",
    "jupyterlab",
    "ipykernel"
]

[tool.uv]
package = true

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
